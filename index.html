<body>
<div id="splash" aria-hidden="true"><div class="lg"><img class="lc" src="icons/splash-c.png" alt=""><div class="sw"></div><img class="ll l0" src="icons/splash-l0.png" alt=""><img class="ll l1" src="icons/splash-l1.png" alt=""><img class="ll l2" src="icons/splash-l2.png" alt=""><img class="ll l3" src="icons/splash-l3.png" alt=""></div></div>
<script>(function(){var s=document.getElementById("splash"),go=function(){if(s)s.classList.add("go")},n=0,k=["splash-c","splash-l0","splash-l1","splash-l2","splash-l3"];k.forEach(function(x){var i=new Image();i.onload=i.onerror=function(){if(++n===k.length)go()};i.src="icons/"+x+".png"});setTimeout(go,1200)})()</script>
<div id="gate" hidden></div>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <button id="fab" type="button" aria-label="Add a task">+</button>
  <nav id="tabs" aria-label="Main">
    <button type="button" data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Today</span></button>
    <button type="button" data-tab="ventures"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/></svg><span>Ventures</span></button>
    <button type="button" data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4 16v2.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V16"/></svg><span>Backup</span></button>
  </nav>
